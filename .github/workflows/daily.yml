name: Günlük Kupon

on:
  schedule:
    # 05:07 UTC ≈ 08:07 TR. Tam saat başı (0. dakika) GitHub'da en yoğun
    # slot; scheduled iş orada sık ertelenir/atlanır. :07'ye kaydırınca
    # daha güvenilir — site sabah ~08:10-08:40 arası güncellenir.
    - cron: "7 5 * * *"
  workflow_dispatch:        # elle de tetiklenebilir

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Önceki geçmişi indir (isabet takibi süreklilik için)
        run: |
          mkdir -p public
          curl -sf "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history.json" \
            -o public/history.json || echo "İlk çalıştırma: geçmiş yok"

      # Maç deposu Actions çalışma alanında yaşamaz (her koşuda sıfırlanır),
      # bu yüzden Pages'te saklanır ve her sabah geri indirilir. İndirme
      # başarısızsa depo boş başlar; ingest onu yeniden doldurur, koşu ölmez.
      - name: Maç deposunu indir
        run: |
          curl -sf "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/warehouse.db" \
            -o warehouse.db || echo "İlk çalıştırma: depo yok"

      - name: Deponun dünkü ve bugünkü maçlarını tazele
        run: python warehouse.py daily 7

      - name: Eksik kutu skorlarını doldur (şut/isabetli şut)
        run: python warehouse.py stats 400
        continue-on-error: true      # zenginleştirme opsiyonel; kuponu bloklamaz

      - name: Siteyi üret
        run: python generate_site.py

      - name: Depoyu yayına kopyala (bir sonraki koşu için)
        run: cp warehouse.db public/warehouse.db

      - name: GitHub Pages'e yayınla
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
